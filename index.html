<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Conectada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #1e1e2f, #2a2a40); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; max-width: 500px; width: 100%; padding: 30px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #1e1e2f; font-size: 24px; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 14px; }
        .form-section { background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: left; }
        .form-section h2 { font-size: 18px; color: #1e1e2f; margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 5px; color: #333; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus { border-color: #0f9d58; outline: none; box-shadow: 0 0 0 3px rgba(15,157,88,0.1); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .btn-submit { background: #0f9d58; color: white; border: none; padding: 12px; width: 100%; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #0b7e47; transform: scale(1.02); }
        .btn-submit:disabled { background: #aaa; cursor: not-allowed; }
        #form-message { margin-top: 10px; font-size: 14px; padding: 8px; border-radius: 8px; display: none; }
        .success { display: block !important; background: #d4edda; color: #155724; }
        .error { display: block !important; background: #f8d7da; color: #721c24; }
        .btn-wsp { display: inline-block; background: #25D366; color: white !important; padding: 14px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 18px; margin: 10px 0 20px 0; transition: 0.3s; box-shadow: 0 4px 10px rgba(37,211,102,0.3); }
        .btn-wsp:hover { transform: scale(1.05); background: #1ebe5a; }
        .social { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .social a { display: inline-flex; justify-content: center; align-items: center; width: 50px; height: 50px; border-radius: 50%; background: #f0f2f5; color: #1e1e2f; font-size: 24px; text-decoration: none; transition: 0.3s; }
        .social a:hover { background: #1e1e2f; color: white; transform: translateY(-5px); }
        .note { margin-top: 20px; font-size: 12px; color: #999; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Conecta conmigo</h1>
        <p class="subtitle">Déjame tus datos y te contacto</p>

        <div class="form-section">
            <h2><i class="fas fa-pen"></i> Contáctame</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ej: Fernando More" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" placeholder="¿En qué puedo ayudarte?" required></textarea>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Enviar datos
                </button>
                <div id="form-message"></div>
            </form>
        </div>

        <a href="https://wa.me/message/AQCYDG3MTXYNI1" target="_blank" class="btn-wsp">
            <i class="fab fa-whatsapp"></i> Escríbeme al WhatsApp
        </a>

        <div class="social">
            <a href="https://facebook.com/tu_usuario" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://instagram.com/tu_usuario" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://x.com/tu_usuario" target="_blank"><i class="fab fa-x-twitter"></i></a>
            <a href="https://youtube.com/tu_canal" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
        <p class="note">💡 Cambia los enlaces de redes sociales por los tuyos.</p>
    </div>

    <script>
        // URL de tu Apps Script (la que me diste)
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbztRV7W0myq0bq1T8RIQJmQ1fvCB7FqkA-5TFTz0YqGiQ__OaHc64G3_76EEQHB2XjUaA/exec';

        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('form-message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
            messageDiv.className = '';
            messageDiv.style.display = 'none';

            const formData = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                mensaje: document.getElementById('mensaje').value
            };

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                mostrarMensaje('success', '✅ ¡Datos enviados! Revisa tu hoja.');
                form.reset();
            } catch (error) {
                mostrarMensaje('error', '❌ Error de conexión. Verifica la URL.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar datos';
            }
        });

        function mostrarMensaje(tipo, texto) {
            messageDiv.textContent = texto;
            messageDiv.className = tipo;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
